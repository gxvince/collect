<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>系统状态与接口调试</title>
    <!-- prettier-ignore -->
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 960px; margin: 0 auto; padding: 24px; }
      section { margin: 16px 0; padding: 16px; border: 1px solid #8886; border-radius: 8px; }
      form, .row, label { display: grid; gap: 10px; }
      .row { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
      input, select, textarea, button { box-sizing: border-box; width: 100%; padding: 8px; font: inherit; }
      textarea { min-height: 120px; font-family: ui-monospace, monospace; }
      pre { overflow: auto; padding: 12px; background: #8882; border-radius: 6px; white-space: pre-wrap; }
      .ok { color: #16803c; }
      .bad { color: #c62828; }
    </style>
  </head>
  <body>
    <h1>系统状态与接口调试</h1>

    <section aria-labelledby="health-title">
      <h2 id="health-title">健康状态</h2>
      <p id="health-status">检查中…</p>
      <ul id="health-checks"></ul>
    </section>

    <section aria-labelledby="login-title">
      <h2 id="login-title">登录</h2>
      <form id="login-form">
        <div class="row">
          <label
            >用户名<input id="username" autocomplete="username" required
          /></label>
          <label
            >密码<input
              id="password"
              type="password"
              autocomplete="current-password"
              required
          /></label>
        </div>
        <button type="submit">登录并保存临时令牌</button>
      </form>
      <p id="login-status">未登录</p>
    </section>

    <section aria-labelledby="request-title">
      <h2 id="request-title">通用 API 请求器</h2>
      <form id="request-form">
        <div class="row">
          <label
            >方法<select id="method">
              <option>GET</option>
              <option>POST</option>
            </select></label
          >
          <label
            >相对路径<input id="path" value="/api/auth/me" required
          /></label>
          <label
            >请求体类型<select id="body-type">
              <option value="none">无请求体</option>
              <option value="json">JSON</option>
              <option value="form">FormData</option>
            </select></label
          >
        </div>
        <label
          >JSON 请求体或 FormData 字段对象<textarea id="body">{}</textarea>
        </label>
        <div class="row">
          <label>文件字段名<input id="file-field" value="file" /></label>
          <label>单文件<input id="file" type="file" /></label>
        </div>
        <button type="submit">发送请求</button>
      </form>
      <h3>请求摘要</h3>
      <pre id="request-summary">尚未发送请求</pre>
      <h3>响应</h3>
      <pre id="response-output">尚无响应</pre>
    </section>

    <script>
      let accessToken = '';
      const byId = (id) => document.getElementById(id);

      function sameOriginPath(value) {
        const path = String(value || '').trim();
        if (!path.startsWith('/') || path.startsWith('//')) {
          throw new Error('仅支持当前站点的相对路径');
        }
        const url = new URL(path, location.origin);
        if (url.origin !== location.origin) {
          throw new Error('仅支持当前站点的相对路径');
        }
        return `${url.pathname}${url.search}`;
      }

      function redact(value) {
        if (Array.isArray(value)) return value.map(redact);
        if (!value || typeof value !== 'object') return value;
        return Object.fromEntries(
          Object.entries(value).map(([key, item]) => [
            key,
            /(password|token|secret)/i.test(key) ? '[已隐藏]' : redact(item),
          ]),
        );
      }

      function show(id, value) {
        byId(id).textContent =
          typeof value === 'string' ? value : JSON.stringify(value, null, 2);
      }

      async function callApi(path, options = {}) {
        const response = await fetch(sameOriginPath(path), options);
        const text = await response.text();
        let body = text;
        try {
          body = text ? JSON.parse(text) : null;
        } catch (error) {
          body = text;
        }
        return { status: response.status, body };
      }

      async function loadHealth() {
        try {
          const result = await callApi('/health');
          const data = result.body && result.body.data;
          const healthy = result.body && result.body.code === 0;
          byId('health-status').textContent =
            data?.status || `HTTP ${result.status}`;
          byId('health-status').className = healthy ? 'ok' : 'bad';
          byId('health-checks').replaceChildren(
            ...((data && data.checks) || []).map((check) => {
              const item = document.createElement('li');
              item.className = check.ok ? 'ok' : 'bad';
              item.textContent = `${check.name}: ${check.message}`;
              return item;
            }),
          );
        } catch (error) {
          byId('health-status').textContent = error.message;
          byId('health-status').className = 'bad';
        }
      }

      byId('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        try {
          const result = await callApi('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: byId('username').value,
              password: byId('password').value,
            }),
          });
          if (!result.body || result.body.code !== 0) {
            throw new Error(result.body?.message || `HTTP ${result.status}`);
          }
          accessToken = result.body.data?.access_token || '';
          byId('password').value = '';
          byId('login-status').textContent = accessToken
            ? '登录成功'
            : '响应中没有访问令牌';
          byId('login-status').className = accessToken ? 'ok' : 'bad';
        } catch (error) {
          accessToken = '';
          byId('login-status').textContent = error.message;
          byId('login-status').className = 'bad';
        }
      });

      byId('request-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const method = byId('method').value;
        const bodyType = byId('body-type').value;
        const file = byId('file').files[0];
        const headers = accessToken
          ? { Authorization: `Bearer ${accessToken}` }
          : {};
        const options = { method, headers };
        try {
          const path = sameOriginPath(byId('path').value);
          if (method !== 'GET' && bodyType === 'json') {
            options.headers['Content-Type'] = 'application/json';
            options.body = JSON.stringify(
              JSON.parse(byId('body').value || '{}'),
            );
          } else if (method !== 'GET' && bodyType === 'form') {
            const fields = JSON.parse(byId('body').value || '{}');
            if (
              !fields ||
              Array.isArray(fields) ||
              typeof fields !== 'object'
            ) {
              throw new Error('FormData 字段必须是 JSON 对象');
            }
            const form = new FormData();
            Object.entries(fields).forEach(([key, value]) =>
              form.append(
                key,
                typeof value === 'string' ? value : JSON.stringify(value),
              ),
            );
            if (file) form.append(byId('file-field').value || 'file', file);
            options.body = form;
          }
          show('request-summary', {
            method,
            path,
            body_type: method === 'GET' ? 'none' : bodyType,
            file: file ? file.name : null,
            authenticated: Boolean(accessToken),
          });
          const result = await callApi(path, options);
          show('response-output', {
            http_status: result.status,
            body: redact(result.body),
          });
        } catch (error) {
          show('response-output', { error: error.message });
        }
      });

      loadHealth();
    </script>
  </body>
</html>
