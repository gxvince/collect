  <style>
    body { font-family: Arial, "Segoe UI", sans-serif; padding: 24px; }
    .status { font-size: 18px; margin-bottom: 12px; }
    .ok { color: #1a7f37; }
    .bad { color: #b42318; }
    .check { margin: 6px 0; }
    .card { border: 1px solid #e5e7eb; padding: 12px; border-radius: 8px; margin-top: 12px; }
    .row { margin: 8px 0; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, select, textarea { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; }
    button { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; }
    button:hover { background: #f3f4f6; }
    label { font-size: 12px; color: #374151; display: flex; align-items: center; gap: 4px; }
    pre { background: #f6f8fa; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
    .note { color: #6b7280; font-size: 12px; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
    textarea { min-height: 96px; width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>

      function formatJson(data) {
        return typeof data === 'string' ? data : JSON.stringify(data, null, 2);
      }

      function buildRequest(method, url, headers, body, extra) {
        const req = { method, url };
        if (headers && Object.keys(headers).length) {
          req.headers = headers;
        }
        try {
          const fullUrl = new URL(url, window.location.origin);
          const query = {};
          fullUrl.searchParams.forEach((value, key) => {
            if (query[key] !== undefined) {
              if (Array.isArray(query[key])) {
                query[key].push(value);
              } else {
                query[key] = [query[key], value];
              }
            } else {
              query[key] = value;
            }
          });
          if (Object.keys(query).length) {
            req.query = query;
          }
        } catch (error) {
          // ignore invalid URL
        }
        if (extra && extra.params && Object.keys(extra.params).length) {
          req.params = extra.params;
        }
        if (body !== undefined) {
          req.body = body;
        }
        if (extra && extra.form && Object.keys(extra.form).length) {
          req.form = extra.form;
        }
        if (extra && extra.client && Object.keys(extra.client).length) {
          req.client = extra.client;
        }
        return req;
      }

        const resText = formatJson(data);
        el.textContent = title + '\n' + '请求:\n' + reqText + '\n\n响应:\n' + resText;
      }

      }

      async function parseJson(res) {
        try {
          return await res.json();
        } catch (error) {
          return { code: res.status, message: '非JSON响应' };
        }
      }

      async function loadHealth() {
        try {
          const res = await fetch('/health');
          const data = await parseJson(res);
          const ok = data && data.code === 0;
          if (statusLabel) {
            statusLabel.textContent = ok ? '状态：正常' : '状态：异常';
            statusLabel.classList.toggle('ok', ok);
            statusLabel.classList.toggle('bad', !ok);
          }
          if (checksBox && data && data.data && Array.isArray(data.data.checks)) {
            checksBox.innerHTML = data.data.checks
              .map((item) => `[${item.ok ? '通过' : '失败'}] ${item.name}: ${item.message}`)
              .map((line) => `<div class="check">${line}</div>`)
              .join('');
          }
          if (rawOutput) {
            rawOutput.textContent = JSON.stringify(data, null, 2);
          }
        } catch (error) {
          if (statusLabel) {
            statusLabel.textContent = '状态：异常';
            statusLabel.classList.add('bad');
          }
        }
      }

      function parseSiteIds(raw) {
        if (!raw) {
          return [];
        }
        return raw
          .split(',')
          .map((item) => item.trim())
          .filter((item) => item);
      }

      function parsePageIds(raw) {
        if (!raw) {
          return [];
        }
        return raw
          .split(',')
          .map((item) => Number(String(item).trim()))
          .filter((item) => Number.isFinite(item) && item > 0);
      }

      function parseJsonArrayInput(raw, label) {
        const text = (raw || '').trim();
        if (!text) {
          return { ok: false, message: '请填写 ' + label + ' JSON' };
        }
        try {
          const value = JSON.parse(text);
          if (!Array.isArray(value)) {
            return { ok: false, message: label + ' JSON 必须是数组' };
          }
          return { ok: true, value };
        } catch (error) {
          return { ok: false, message: label + ' JSON 必须是合法 JSON' };
        }
      }

        const url = '/api/proxy/translate';
        const body = {
          text,
          target_language: target,
          source_language: source || undefined,
          format_type: formatType || undefined,
          mode: mode || undefined,
          scene: scene || undefined,
          context: context || undefined,

        const req = buildRequest(
          'POST',

            Authorization: 'Bearer ' + accessToken,
            'Content-Type': 'application/json',
          },
          {
            text,
            target_language: target,
            source_language: source || undefined,
            format_type: formatType || undefined,
            mode: mode || undefined,
            scene: scene || undefined,

        setTranslateLoading('翻译中...', req);

        }
      }
